name: Refresh H.A.Y. listings

on:
  schedule:
    - cron: "17 3 * * *"   # every night at 03:17 UTC
  workflow_dispatch:        # adds a "Run workflow" button on the Actions tab

permissions:
  contents: write

concurrency:
  group: refresh-listings
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild data/listings.json from H.A.Y.
        run: python3 scripts/build_listings.py

      - name: Commit and publish
        run: |
          if git diff --quiet -- data/listings.json; then echo "No change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/listings.json
          git commit -m "Refresh H.A.Y. listings $(date -u +%Y-%m-%d)"
          git push
